# Maintained via
# echo "1.2.3.4 BAD" >> /mesonet/blocklist.txt
# httxt2dbm -i /mesonet/blocklist.txt -o /mesonet/blocklist.map

RewriteEngine On
RewriteOptions InheritDownBefore
RewriteMap ip_blocklist "dbm:/mesonet/blocklist.map"

# Custom in-line response to hopefully help users with what is happening
ErrorDocument 403 "403 Forbidden: Access blocked by IEM WAF. If you believe this is in error, contact akrherz@iastate.edu with your connecting IP address."

RewriteCond ${ip_blocklist:%{REMOTE_ADDR}|OK} "BAD"

# F = Forbidden response for blocked IPs
RewriteRule ^ - [F,L]
